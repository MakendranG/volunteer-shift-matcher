<text x="40" y="640" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#64748b">User interface -> Strands agent loop -> match_shifts tool -> Amazon Bedrock -> output. Synthetic data only; no hardcoded credentials.</text>
