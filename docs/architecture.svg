<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<text x="40" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#0f172a">Volunteer Shift Matcher — Architecture</text>
<text x="40" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">Built with the Strands Agents SDK · Good Neighbor Agents track</text>
<rect x="40" y="130" width="240" height="80" rx="14" fill="#ecfdf5" stroke="#14b8a6" stroke-width="2"/><text x="160.0" y="164.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Volunteer data</text><text x="160.0" y="184.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#0f172a">skills + availability</text>
<rect x="40" y="250" width="240" height="80" rx="14" fill="#ecfdf5" stroke="#14b8a6" stroke-width="2"/><text x="160.0" y="284.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Shift data</text><text x="160.0" y="304.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#0f172a">role, date, time, needed</text>
<rect x="340" y="110" width="440" height="300" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="560" y="138" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#0f766e">shift_matcher_agent — Strands Agents SDK</text>
<rect x="370" y="160" width="380" height="66" rx="14" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="560.0" y="199.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Agent loop (LLM)</text>
<rect x="370" y="250" width="380" height="72" rx="14" fill="#14b8a6" stroke="#0f766e" stroke-width="2"/><text x="560.0" y="280.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">match_shifts  @tool</text><text x="560.0" y="300.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#ffffff">deterministic Python: eligibility,</text><text x="560.0" y="315.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#ffffff">no double-booking, flags gaps</text>
<rect x="370" y="344" width="380" height="56" rx="14" fill="#14b8a6" stroke="#0f766e" stroke-width="2"/><text x="560.0" y="366.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">LLM drafting layer</text><text x="560.0" y="386.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#ffffff">Amazon Bedrock · Claude</text>
<line x1="560" y1="226" x2="560" y2="250" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="560" y1="322" x2="560" y2="344" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="766" y="242" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">calls tool</text>
<text x="766" y="338" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">match plan</text>
<rect x="840" y="130" width="320" height="70" rx="14" fill="#ecfdf5" stroke="#14b8a6" stroke-width="2"/><text x="1000.0" y="159.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Output</text><text x="1000.0" y="179.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#0f172a">structured JSON + visual summary</text>
<rect x="840" y="250" width="320" height="66" rx="14" fill="#ecfdf5" stroke="#14b8a6" stroke-width="2"/><text x="1000.0" y="277.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Confirmation messages</text><text x="1000.0" y="297.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#0f172a">per assigned volunteer</text>
<rect x="840" y="344" width="320" height="66" rx="14" fill="#ecfdf5" stroke="#14b8a6" stroke-width="2"/><text x="1000.0" y="371.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Help-needed broadcasts</text><text x="1000.0" y="391.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#0f172a">per unfilled / partial shift</text>
<line x1="280" y1="170" x2="340" y2="210" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="280" y1="290" x2="340" y2="250" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="780" y1="260" x2="840" y2="200" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="1000" y1="200" x2="1000" y2="250" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="1000" y1="316" x2="1000" y2="344" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="640" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#64748b">Deterministic tool owns the assignments (auditable); the LLM owns the natural-language messages. Synthetic data only; no hardcoded credentials.</text>
</svg>